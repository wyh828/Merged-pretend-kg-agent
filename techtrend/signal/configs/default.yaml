project_name: predictive-agents
timezone: Asia/Shanghai
random_seed: 42
# Default loading inherits DATA_DIR and COLLECTION_START/END_DATE from Settings.
# Explicit historical config files can specify their own paths and windows.
resources_root: resources
window_size_months: 1
default_data_split:
  strategy: time_based
  train_ratio: 0.7
  validation_ratio: 0.15
  test_ratio: 0.15
